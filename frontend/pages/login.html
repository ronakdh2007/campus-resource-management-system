<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResManager Login</title>
  
  <link rel="stylesheet" href="../css/login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  
  <div class="wrapper">
    
    <div class="title-bar">
      <h1 class="resmanager-heading">ResManager</h1>
      <p class="title-tagline">A Resource Management System For Manipal University Jaipur</p>
    </div>
    
    <div class="login-card-container">
      <div class="login-card">
        <h2 class="welcome-heading">Welcome Back</h2>
        <p class="instruction-para">Sign in with your college email. We will send you a one-time code.</p>

        <div id="email-step" class="login-form">
          <input type="email" id="login-email" class="login-input" placeholder="name@muj.manipal.edu" autocomplete="email">
          <button class="login-btn" id="send-code-btn">Send code</button>
        </div>

        <div id="code-step" class="login-form hidden">
          <p id="code-sent-msg" class="code-sent-msg"></p>
          <input type="text" id="login-code" class="login-input" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code">
          <button class="login-btn" id="verify-code-btn">Verify and sign in</button>
          <button class="login-link-btn" id="change-email-btn">Use a different email</button>
        </div>

        <p id="login-error" class="login-error"></p>
      </div>
    </div>
    
    <p class="footer-credit">Created by Ronak Dhaka & Garv Jain</p>
    
  </div>
  
  <script src="../js/login.js"></script>
</body>
</html>
